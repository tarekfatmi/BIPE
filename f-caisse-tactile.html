<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>BIPE — Caisse tactile</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="shared.js"></script>
<style>
  :root{
    --black:#000000; --black-2:#0a0a0a; --black-3:#141414;
    --line:#2a2a2a; --line-soft:#1f1f1f;
    --gold:#d4af37; --gold-bright:#f0d060; --gold-soft:#e8c96a;
    --gold-dim:#8a7433; --gold-deep:#5a4a1f;
    --txt:#f5f0e1; --txt-muted:#9a9384; --txt-dim:#5a564e;
    --ok:#6b9a5a; --warn:#c9a040; --bad:#b84040; --info:#7cc4e8;
    --radius:16px; --radius-sm:12px;
    --groupe-couleur:#7cc4e8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:'Baloo Bhaijaan 2', -apple-system, "Segoe UI", sans-serif;
    background:var(--black); color:var(--txt); line-height:1.5; font-weight:500;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(124,196,232,.06) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(212,175,55,.02) 0%, transparent 40%);
    background-attachment:fixed;
  }

  .app{max-width:min(1300px,96vw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  .bipe-sheet{transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
  .bipe-sheet.show{transform:translateY(0) !important}
  #bipe-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
  #bipe-overlay.show{opacity:1 !important;pointer-events:auto !important}

  .header{
    position:sticky;top:0;z-index:50;background:rgba(0,0,0,.92);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line-soft);
    padding:clamp(10px,1.5vw,14px) clamp(14px,2.5vw,20px);
    display:flex;align-items:center;gap:clamp(8px,1.5vw,14px);
  }
  .header .back{
    width:clamp(40px,5.5vw,46px);height:clamp(40px,5.5vw,46px);
    border-radius:12px;background:var(--black-3);border:1px solid var(--line);
    color:var(--gold-soft);font-size:clamp(1.1rem,1.8vw,1.3rem);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;text-decoration:none;
  }
  .header .title-block{flex:1;min-width:0}
  .header .logo{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.1rem,2.2vw,1.4rem);
    font-weight:700;color:#f0d060;line-height:1.1;letter-spacing:.02em;
  }
  .header .logo .b,.header .logo .pe{color:var(--txt)}
  .header .logo .excl{color:var(--gold);font-size:1.3em;vertical-align:middle;text-shadow:0 0 20px rgba(212,175,55,.5)}
  .header .subtitle{
    font-size:clamp(.58rem,.9vw,.68rem);color:var(--txt-muted);
    font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  }
  .header .fullscreen{
    width:clamp(40px,5.5vw,46px);height:clamp(40px,5.5vw,46px);
    border-radius:12px;background:var(--black-3);border:1px solid var(--line);
    color:var(--gold-soft);font-size:clamp(1rem,1.6vw,1.2rem);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .header .menu{
    width:clamp(40px,5.5vw,46px);height:clamp(40px,5.5vw,46px);
    border-radius:12px;background:var(--black-3);border:1px solid var(--line);
    color:var(--gold-soft);font-size:clamp(1.1rem,1.8vw,1.3rem);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }

  .pos-layout{
    flex:1;display:grid;
    grid-template-columns:1fr 380px;
    gap:clamp(12px,2vw,20px);
    padding:clamp(12px,2vw,20px);
    min-height:0;
  }

  .kpi-bar{
    display:grid;grid-template-columns:repeat(5,1fr);
    gap:8px;margin-bottom:10px;
  }
  .kpi-mini{
    background:var(--black-2);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;
    position:relative;overflow:hidden;
  }
  .kpi-mini::before{
    content:'';position:absolute;top:0;left:0;width:3px;height:100%;
    background:var(--gold);opacity:.6;
  }
  .kpi-mini .lab{
    font-size:.65rem;color:var(--txt-muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;
  }
  .kpi-mini .val{
    font-family:'Fredoka',sans-serif;font-size:1.05rem;
    font-weight:700;color:var(--gold-bright);line-height:1.1;
  }
  .kpi-mini.credit .val{color:var(--warn)}
  .kpi-mini.ventes .val{color:var(--info)}
  .kpi-mini.moyen .val{color:var(--ok)}
  .kpi-mini.best .val{color:var(--gold-bright)}
  .kpi-mini .kpi-sub{
    font-size:.62rem;color:var(--txt-muted);font-weight:600;
    margin-top:2px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;line-height:1.2;
  }

  .col-produits{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}

  .tabs{
    display:flex;gap:4px;background:var(--black-2);
    border-radius:12px;padding:3px;border:1px solid var(--line);
  }
  .tab-btn{
    flex:1;padding:9px 12px;border:none;border-radius:9px;
    background:transparent;color:var(--txt-muted);
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:.88rem;font-weight:700;cursor:pointer;transition:.15s;
  }
  .tab-btn.active{background:var(--gold);color:#0a0a0a}

  .tab-content{display:none;flex:1;min-height:0;flex-direction:column}
  .tab-content.active{display:flex}

  .search-bar{
    display:flex;align-items:center;gap:10px;
    background:var(--black-2);border:2px solid var(--line);
    border-radius:12px;padding:0 14px;height:52px;
    transition:border-color .2s;
  }
  .search-bar:focus-within{border-color:var(--gold)}
  .search-bar .ico{font-size:1.1rem;flex-shrink:0}
  .search-bar input{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--txt);font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:clamp(.95rem,1.1vw,1.05rem);font-weight:500;padding:0;
  }
  .search-bar input::placeholder{color:var(--txt-dim)}

  .produits-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(clamp(120px,15vw,160px),1fr));
    gap:clamp(8px,1.5vw,12px);
    overflow-y:auto;padding-right:4px;flex:1;
  }

  .produit-tuile{
    background:var(--black-2);border:2px solid var(--line);
    border-radius:14px;padding:clamp(12px,2vw,16px);
    cursor:pointer;transition:all .15s;
    display:flex;flex-direction:column;gap:6px;
    position:relative;overflow:hidden;user-select:none;min-height:100px;
  }
  .produit-tuile::before{
    content:'';position:absolute;top:0;left:0;width:3px;height:100%;
    background:var(--groupe-couleur);opacity:.6;
  }
  .produit-tuile:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
  .produit-tuile:active{transform:scale(.97)}
  .produit-tuile.rupture{opacity:.5;cursor:not-allowed}
  .produit-tuile.rupture::before{background:var(--bad)}
  .produit-tuile .nom{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(.85rem,1.1vw,.98rem);line-height:1.25;
    color:var(--txt);overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .produit-tuile .stock{
    font-size:clamp(.72rem,.9vw,.8rem);color:var(--txt-muted);font-weight:600;
  }
  .produit-tuile .stock.bas{color:var(--warn)}
  .produit-tuile .stock.zero{color:#e08a8a}
  .produit-tuile .prix{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(1rem,1.3vw,1.2rem);color:var(--gold-bright);
    margin-top:auto;
  }

  .empty-produits{
    grid-column:1/-1;text-align:center;padding:40px 20px;
    background:var(--black-2);border:2px dashed var(--line);border-radius:14px;
  }
  .empty-produits .ico{font-size:2.5rem;margin-bottom:10px;opacity:.6}
  .empty-produits h3{
    font-family:'Fredoka',sans-serif;color:var(--gold-soft);
    font-size:1.05rem;margin-bottom:6px;
  }
  .empty-produits p{color:var(--txt-muted);font-size:.85rem}

  /* ===== HISTORIQUE ===== */
  .histo-filtres{
    display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;
    align-items:center;
  }
  .histo-filtres select{
    padding:8px 12px;border-radius:10px;
    background:var(--black-2);border:2px solid var(--line);
    color:var(--txt);font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:.85rem;font-weight:600;
    flex:1;min-width:180px;cursor:pointer;
  }
  .histo-filtres select:focus{outline:none;border-color:var(--gold)}
  .histo-filtres .btn-reset{
    padding:8px 12px;border-radius:10px;
    background:var(--black-3);border:2px solid var(--line);
    color:var(--txt-muted);font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:.82rem;font-weight:700;cursor:pointer;
  }
  .histo-filtres .btn-reset:hover{border-color:var(--gold-dim);color:var(--txt)}
  .histo-filtres .compteur{
    padding:8px 12px;border-radius:10px;
    background:rgba(212,175,55,.08);border:1px solid var(--gold-dim);
    color:var(--gold-soft);font-size:.8rem;font-weight:700;
    white-space:nowrap;
  }

  .historique-list{
    flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
    padding-right:4px;
  }
  .histo-jour{
    background:var(--black-2);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;
  }
  .histo-jour-header{
    padding:10px 14px;background:var(--black-3);
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line-soft);
  }
  .histo-jour-header .date{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:.92rem;color:var(--gold-soft);
  }
  .histo-jour-header .totaux{
    display:flex;gap:12px;font-size:.75rem;font-weight:700;
  }
  .histo-jour-header .totaux .nb{color:var(--info)}
  .histo-jour-header .totaux .ca{color:var(--ok)}
  .histo-op{
    padding:9px 14px;display:flex;justify-content:space-between;
    align-items:center;border-bottom:1px solid var(--line-soft);
    font-size:.82rem;
  }
  .histo-op:last-child{border-bottom:none}
  .histo-op .op-info{flex:1;min-width:0}
  .histo-op .op-nom{font-weight:700;color:var(--txt);margin-bottom:1px}
  .histo-op .op-details{
    font-size:.72rem;color:var(--txt-muted);
  }
  .histo-op .op-montant{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:.92rem;color:var(--gold-bright);white-space:nowrap;
    margin-left:12px;
  }
  .histo-op .op-montant.credit{color:var(--warn)}
  .histo-op .badge-mode{
    display:inline-block;padding:1px 6px;border-radius:4px;
    font-size:.68rem;font-weight:700;margin-left:4px;
  }
  .badge-paye{background:rgba(107,154,90,.15);color:var(--ok)}
  .badge-credit{background:rgba(201,160,64,.15);color:var(--warn)}
  .histo-empty{
    text-align:center;padding:40px 20px;
    background:var(--black-2);border:2px dashed var(--line);
    border-radius:14px;color:var(--txt-muted);font-size:.88rem;
  }

  /* ===== CAISSE / SESSION ===== */
  .caisse-content{
    flex:1;overflow-y:auto;display:flex;flex-direction:column;
    gap:12px;padding-right:4px;
  }
  .caisse-card{
    background:var(--black-2);border:2px solid var(--line);
    border-radius:14px;padding:16px;
  }
  .caisse-card h3{
    font-family:'Fredoka',sans-serif;font-size:.95rem;
    color:var(--gold-soft);margin-bottom:10px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .caisse-card .solde-big{
    font-family:'Fredoka',sans-serif;font-size:2rem;
    font-weight:700;color:var(--gold-bright);
    line-height:1;margin:6px 0;
  }
  .caisse-card .solde-big.fin{color:var(--ok)}
  .caisse-card .desc{
    font-size:.78rem;color:var(--txt-muted);line-height:1.5;margin-top:4px;
  }
  .caisse-card .input-row{
    display:flex;gap:8px;margin-top:10px;
  }
  .caisse-card input{
    flex:1;padding:10px 12px;border-radius:10px;
    background:var(--black-3);border:2px solid var(--line);
    color:var(--txt);font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:1rem;font-weight:600;
  }
  .caisse-card input:focus{outline:none;border-color:var(--gold)}
  .caisse-card input:disabled{opacity:.6;cursor:not-allowed}
  .btn-caisse{
    padding:10px 16px;border-radius:10px;border:none;
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:.9rem;font-weight:700;cursor:pointer;
    transition:.15s;
  }
  .btn-caisse.gold{
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#0a0a0a;
  }
  .btn-caisse.gold:hover{filter:brightness(1.08)}
  .btn-caisse.gold:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn-caisse.ghost{
    background:var(--black-3);color:var(--txt);
    border:2px solid var(--line);
  }
  .btn-caisse.ghost:hover{border-color:var(--gold-dim)}
  .btn-caisse.danger{
    background:rgba(184,64,64,.15);color:#e0a0a0;
    border:2px solid var(--bad);
  }
  .btn-caisse.danger:hover{background:var(--bad);color:#fff}

  .caisse-row{
    display:flex;justify-content:space-between;
    font-size:.82rem;padding:5px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .caisse-row:last-child{border-bottom:none}
  .caisse-row .lab{color:var(--txt-muted)}
  .caisse-row .val{font-weight:700;color:var(--txt)}
  .caisse-row .val.plus{color:var(--ok)}
  .caisse-row .val.moins{color:var(--bad)}

  .cloture-badge{
    display:inline-block;padding:4px 10px;border-radius:999px;
    font-size:.72rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;
  }
  .cloture-badge.ok{background:rgba(107,154,90,.15);color:var(--ok);border:1px solid var(--ok)}
  .cloture-badge.ouvert{background:rgba(201,160,64,.15);color:var(--warn);border:1px solid var(--warn)}

  /* ===== COLONNE DROITE : PANIER ===== */
  .col-panier{
    background:var(--black-2);
    border:2px solid var(--line);
    border-radius:16px;
    display:flex;flex-direction:column;
    max-height:calc(100vh - 120px);
    position:sticky;top:80px;
    align-self:start;
  }
  .panier-header{
    padding:14px 18px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .panier-header h2{
    font-family:'Fredoka',sans-serif;font-size:1.05rem;
    color:var(--gold-soft);font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .panier-header .count{
    background:var(--gold);color:#0a0a0a;
    font-weight:800;font-size:.75rem;
    padding:2px 8px;border-radius:999px;
  }
  .panier-header .clear-panier{
    background:transparent;border:none;color:var(--txt-muted);
    font-size:1.2rem;cursor:pointer;padding:4px 8px;
    border-radius:8px;transition:.15s;
  }
  .panier-header .clear-panier:hover{color:var(--bad)}

  .panier-list{
    flex:1;overflow-y:auto;padding:8px 12px;
    display:flex;flex-direction:column;gap:6px;min-height:80px;
  }
  .panier-list:empty::after{
    content:'Panier vide — clique sur un produit';
    display:block;text-align:center;color:var(--txt-dim);
    font-size:.82rem;padding:24px 12px;font-style:italic;
  }
  .panier-item{
    background:var(--black-3);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;
    display:flex;align-items:center;gap:8px;
  }
  .panier-item .info{flex:1;min-width:0}
  .panier-item .nom{
    font-weight:700;font-size:.85rem;color:var(--txt);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .panier-item .prix-u{font-size:.72rem;color:var(--txt-muted)}
  .panier-item .qte-ctrl{
    display:flex;align-items:center;gap:4px;
    background:var(--black-2);border-radius:8px;padding:2px;
  }
  .panier-item .qte-ctrl button{
    width:26px;height:26px;border-radius:6px;
    background:var(--black-3);border:1px solid var(--line);
    color:var(--txt);font-weight:700;cursor:pointer;font-size:.85rem;
    display:flex;align-items:center;justify-content:center;
  }
  .panier-item .qte-ctrl button:hover{border-color:var(--gold-dim)}
  .panier-item .qte-ctrl .qte{
    min-width:24px;text-align:center;
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:.9rem;color:var(--gold-bright);
  }
  .panier-item .sous-total{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:.88rem;color:var(--txt);
    min-width:60px;text-align:right;
  }

  .panier-options{
    padding:10px 12px;border-top:1px solid var(--line-soft);
    display:flex;flex-direction:column;gap:8px;
  }
  .option-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;font-size:.82rem;
  }
  .option-row label{color:var(--txt-muted);font-weight:600;font-size:.82rem}
  .option-row select, .option-row input{
    padding:6px 10px;border-radius:8px;
    background:var(--black-3);border:1px solid var(--line);
    color:var(--txt);font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:.82rem;font-weight:500;max-width:180px;
  }
  .option-row select:focus, .option-row input:focus{outline:none;border-color:var(--gold)}

  .paiement-toggle{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;
    background:var(--black-3);border-radius:10px;padding:3px;
  }
  .paiement-toggle button{
    padding:8px;border-radius:8px;border:none;
    background:transparent;color:var(--txt-muted);
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s;
  }
  .paiement-toggle button.active{background:var(--gold);color:#0a0a0a}

  .compta-check{
    display:flex;align-items:center;gap:8px;
    font-size:.8rem;color:var(--txt-muted);cursor:pointer;
  }
  .compta-check input{cursor:pointer;accent-color:var(--gold)}

  .panier-total{
    padding:14px 18px;border-top:2px solid var(--gold-deep);
    background:linear-gradient(135deg, rgba(212,175,55,.06), transparent);
  }
  .panier-total .ligne{
    display:flex;justify-content:space-between;
    font-size:.85rem;color:var(--txt-muted);margin-bottom:4px;
  }
  .panier-total .total{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Fredoka',sans-serif;
    padding-top:8px;border-top:1px solid var(--line-soft);margin-top:6px;
  }
  .panier-total .total .lab{font-size:.9rem;color:var(--txt);font-weight:700}
  .panier-total .total .val{
    font-size:1.5rem;color:var(--gold-bright);font-weight:700;
  }

  .btn-encaisser{
    margin:0 12px 12px;padding:16px;border-radius:12px;border:none;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#0a0a0a;
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:1.05rem;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 4px 20px rgba(212,175,55,.3);transition:all .15s;
  }
  .btn-encaisser:hover{filter:brightness(1.08)}
  .btn-encaisser:active{transform:scale(.98)}
  .btn-encaisser:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}

  .new-client-box{
    margin-top:10px;padding:12px;
    background:rgba(212,175,55,.05);

<script>
/* ============================================================
   BIPE — f-caisse-tactile.html v4 finale
   POS : KPI (5) + historique filtré produit + session caisse
   ============================================================ */

BIPE.checkSession();

const SESSION_KEY = 'bipe_caisse_session';

let panier = [];
let produits = [];
let searchTerm = '';
let paiement = 'paye';
let clientSelectionne = null;
let currentTab = 'produits';
let histoFiltreProduit = '';

function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------- Sheet helpers ---------- */
function ouvrirSheet(id){
  let overlay = document.getElementById('bipe-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'bipe-overlay';
    overlay.onclick = BIPE.closeAllSheets;
    document.body.appendChild(overlay);
  }
  overlay.classList.add('show');
  const sheet = document.getElementById(id);
  if(sheet) sheet.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function fermerSheet(){
  const overlay = document.getElementById('bipe-overlay');
  if(overlay) overlay.classList.remove('show');
  document.querySelectorAll('.bipe-sheet').forEach(s => s.classList.remove('show'));
  document.body.style.overflow = '';
}

/* ---------- Stock helpers ---------- */
function getMouvements(){ return BIPE.storage.get(BIPE.KEYS.stock, []) || []; }
function saveMouvements(mvts){ BIPE.storage.set(BIPE.KEYS.stock, mvts); }
function getPid(m){
  return m.produitId || m.produit || m.produit_id || m.id_produit || ('nom:' + (m.nom || ''));
}
function stockDisponible(produitId){
  return getMouvements()
    .filter(m => getPid(m) === produitId)
    .reduce((s, m) => {
      const qte = Number(m.quantite) || Number(m.qte) || 0;
      const type = (m.type || m.sens || '').toLowerCase();
      if(type === 'entree' || type === 'entrée' || type === 'in' || type === 'achat') return s + qte;
      if(type === 'sortie' || type === 'out' || type === 'vente') return s - qte;
      return s;
    }, 0);
}
function getProduitsFromStock(){
  const mvts = getMouvements();
  const map = new Map();
  mvts.forEach(m => {
    const pid = getPid(m);
    if(!map.has(pid)){
      map.set(pid, { id: pid, nom: m.nom || m.produit || pid || 'Sans nom', prix: Number(m.prix) || 0 });
    } else {
      const p = map.get(pid);
      const px = Number(m.prix) || 0;
      if(px > 0) p.prix = px;
    }
  });
  return Array.from(map.values())
    .map(p => ({...p, stock: stockDisponible(p.id)}))
    .sort((a, b) => a.nom.localeCompare(b.nom));
}
function creerMouvementSortie(vente){
  const mvts = getMouvements();
  mvts.push({
    id: 'mv-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6),
    type: 'sortie', produitId: vente.produitId, nom: vente.produitNom,
    quantite: vente.quantite, prix: vente.prix, date: vente.date,
    motif: 'Vente POS', venteId: vente.id,
    clientId: vente.clientId || null, clientNom: vente.clientNom || null,
    createdAt: new Date().toISOString()
  });
  saveMouvements(mvts);
}

/* ---------- Trésorerie ---------- */
function getTresorerie(){ return BIPE.storage.get(BIPE.KEYS.tresorerie, []) || []; }
function saveTresorerie(t){ BIPE.storage.set(BIPE.KEYS.tresorerie, t); }
function creerMouvementTresorerieEspeces(montantTotal, date, note){
  const t = getTresorerie();
  t.push({
    id: 'tr-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6),
    libelle: `💰 Vente POS (${date})`,
    sens: 'entree', montant: montantTotal, date, mode: 'especes',
    compteId: null, compteNom: null, note: note || 'Encaissement POS',
    source: 'pos', createdAt: new Date().toISOString()
  });
  saveTresorerie(t);
}

/* ---------- Clients ---------- */
function getClients(){ return BIPE.storage.get(BIPE.KEYS.clients, []) || []; }
function saveClients(clients){ BIPE.storage.set(BIPE.KEYS.clients, clients); }
function populateClients(){
  const clients = getClients();
  const sel = document.getElementById('clientSelect');
  if(!sel) return;
  const options = clients.slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||''))
    .map(c => `<option value="${c.id}">${BIPE.esc(c.nom || 'Sans nom')}</option>`).join('');
  sel.innerHTML = `<option value="">— Aucun —</option><option value="__NEW__">✨ Nouveau client</option>${options}`;
  clientSelectionne = null;
}
function toggleNewClient(){
  const sel = document.getElementById('clientSelect');
  const box = document.getElementById('newClientBox');
  if(!sel || !box) return;
  box.style.display = (sel.value === '__NEW__') ? 'block' : 'none';
  if(sel.value !== '__NEW__' && sel.value !== ''){
    const c = getClients().find(x => x.id === sel.value);
    clientSelectionne = c ? { id: c.id, nom: c.nom } : null;
  } else {
    clientSelectionne = null;
  }
}
function creerClientRapide(){
  const nom = document.getElementById('ncNom').value.trim();
  const tel = document.getElementById('ncTel').value.trim();
  const email = document.getElementById('ncEmail').value.trim();
  if(!nom){ BIPE.toast('⚠ Nom du client obligatoire', true); return null; }
  const clients = getClients();
  const existant = clients.find(c => (c.nom||'').toLowerCase() === nom.toLowerCase());
  if(existant) return existant;
  const nc = { id: 'c-' + Date.now().toString(36), nom, tel, email, createdAt: new Date().toISOString() };
  clients.push(nc); saveClients(clients);
  return nc;
}

/* ---------- Compta ---------- */
function getEcritures(){ return BIPE.storage.get(BIPE.KEYS.compta, []) || []; }
function saveEcritures(ecritures){ BIPE.storage.set(BIPE.KEYS.compta, ecritures); }
function genererEcrituresPourVentes(ventes){
  if(ventes.length === 0) return 0;
  const ecritures = getEcritures();
  const now = new Date().toISOString();
  let count = 0;
  ventes.forEach(v => {
    const details = `${BIPE.esc(v.produitNom)} × ${v.quantite}${v.clientNom ? ' — ' + BIPE.esc(v.clientNom) : ''}`;
    ecritures.push({
      id: 'ec-' + Date.now().toString(36) + '-' + count + '-1',
      libelle: `Vente ${BIPE.esc(v.produitNom)}`, date: v.date,
      compte: '411 Clients', sens: 'debit', montant: Number(v.montant) || 0,
      note: `${details}\n\nÉcriture POS.`, source: 'pos', venteId: v.id,
      numero: '411', typeLigne: 'debit', createdAt: now
    });
    count++;
    ecritures.push({
      id: 'ec-' + Date.now().toString(36) + '-' + count + '-2',
      libelle: `Vente ${BIPE.esc(v.produitNom)}`, date: v.date,
      compte: '701 Ventes de produits', sens: 'credit', montant: Number(v.montant) || 0,
      note: details, source: 'pos', venteId: v.id,
      numero: '701', typeLigne: 'credit', createdAt: now
    });
    count++;
  });
  saveEcritures(ecritures);
  return ventes.length;
}

/* ---------- Crédits ---------- */
function ajouterCredit(vente){
  const credits = BIPE.storage.get(BIPE.KEYS.credits, []) || [];
  credits.push({
    id: 'cr-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6),
    clientId: vente.clientId, clientNom: vente.clientNom,
    montant: Number(vente.montant) || 0, montantPaye: 0,
    date: vente.date, venteId: vente.id,
    note: `Vente POS à crédit — ${vente.produitNom} × ${vente.quantite}`,
    createdAt: new Date().toISOString()
  });
  BIPE.storage.set(BIPE.KEYS.credits, credits);
}

/* ============================================================
   SESSION CAISSE
   ============================================================ */
function getSession(){
  const s = BIPE.storage.get(SESSION_KEY);
  const today = todayISO();
  if(!s || s.date !== today){
    const nouvelle = { date: today, soldeDepart: 0, soldeFin: null, clotureAt: null };
    BIPE.storage.set(SESSION_KEY, nouvelle);
    return nouvelle;
  }
  return s;
}
function saveSession(s){ BIPE.storage.set(SESSION_KEY, s); }

function calculerEspecesDuJour(){
  const today = todayISO();
  const mouvements = getTresorerie().filter(m => m.date === today && m.mode === 'especes');
  const entrees = mouvements.filter(m => m.sens === 'entree')
    .reduce((s,m) => s + (Number(m.montant)||0), 0);
  const sorties = mouvements.filter(m => m.sens === 'sortie')
    .reduce((s,m) => s + (Number(m.montant)||0), 0);
  return { entrees, sorties, net: entrees - sorties, nb: mouvements.length };
}
function calculerSoldeFin(){
  const session = getSession();
  const { net } = calculerEspecesDuJour();
  return (Number(session.soldeDepart) || 0) + net;
}

/* ---------- KPI du jour ---------- */
function calculerKPIJour(){
  const today = todayISO();
  const ventes = BIPE.storage.get(BIPE.KEYS.ventes, []) || [];
  const ventesJour = ventes.filter(v => v.date === today && v.source === 'pos');

  const nb = ventesJour.length;
  const ca = ventesJour.reduce((s,v) => s + (Number(v.montant)||0), 0);
  const caCredit = ventesJour.filter(v => v.paye === false)
    .reduce((s,v) => s + (Number(v.montant)||0), 0);
  const panierMoyen = nb > 0 ? ca / nb : 0;
  const pctCredit = ca > 0 ? (caCredit / ca) * 100 : 0;

  let meilleur = null;
  if(ventesJour.length > 0 && ca > 0){
    const parProduit = {};
    ventesJour.forEach(v => {
      const key = v.produitId || v.produitNom || 'inconnu';
      if(!parProduit[key]){
        parProduit[key] = { nom: v.produitNom || 'Produit', ca: 0, qte: 0 };
      }
      parProduit[key].ca += Number(v.montant) || 0;
      parProduit[key].qte += Number(v.quantite) || 0;
    });
    const entries = Object.values(parProduit);
    entries.sort((a,b) => b.ca - a.ca);
    const top = entries[0];
    meilleur = { nom: top.nom, ca: top.ca, qte: top.qte, pct: (top.ca / ca) * 100 };
  }

  return { nb, ca, caCredit, panierMoyen, pctCredit, meilleur };
}

function renderKPI(){
  const k = calculerKPIJour();
  document.getElementById('kpiNbVentes').textContent = k.nb;
  document.getElementById('kpiPanierMoyen').textContent = BIPE.fmt(Math.round(k.panierMoyen));
  document.getElementById('kpiPctCredit').textContent = Math.round(k.pctCredit) + '%';
  document.getElementById('kpiCaJour').textContent = BIPE.fmt(Math.round(k.ca));

  const pctEl = document.getElementById('kpiBestPct');
  const nomEl = document.getElementById('kpiBestNom');

  if(k.meilleur){
    pctEl.textContent = Math.round(k.meilleur.pct) + '%';
    nomEl.textContent = k.meilleur.nom;
    nomEl.title = `${k.meilleur.nom} — ${BIPE.fmt(k.meilleur.ca)} DT (× ${k.meilleur.qte})`;
  } else {
    pctEl.textContent = '—';
    nomEl.textContent = 'Aucune vente';
    nomEl.title = '';
  }
}

/* ============================================================
   HISTORIQUE (avec filtre produit)
   ============================================================ */
function populateFiltreHistoProduits(){
  const sel = document.getElementById('histoFiltreProduit');
  if(!sel) return;

  const ventes = BIPE.storage.get(BIPE.KEYS.ventes, []) || [];
  const ventesPOS = ventes.filter(v => v.source === 'pos');

  // Map produitId -> nom (on privilégie le nom le plus récent)
  const map = new Map();
  ventesPOS.forEach(v => {
    const key = v.produitId || v.produitNom || 'inconnu';
    if(!map.has(key) || (v.produitNom && v.produitNom.length > 0)){
      map.set(key, v.produitNom || 'Produit');
    }
  });

  const options = Array.from(map.entries())
    .sort((a, b) => a[1].localeCompare(b[1]))
    .map(([id, nom]) => `<option value="${BIPE.esc(id)}">${BIPE.esc(nom)}</option>`)
    .join('');

  // Conserver la sélection si toujours valide
  const currentVal = histoFiltreProduit;
  sel.innerHTML = `<option value="">🔍 Tous les produits</option>${options}`;

  if(currentVal && map.has(currentVal)){
    sel.value = currentVal;
  } else if(currentVal && !map.has(currentVal)){
    // Le produit filtré n'existe plus
    histoFiltreProduit = '';
    sel.value = '';
  }
}

function renderHistorique(){
  const list = document.getElementById('historiqueList');
  const compteur = document.getElementById('histoCompteur');
  const ventes = BIPE.storage.get(BIPE.KEYS.ventes, []) || [];
  let ventesPOS = ventes.filter(v => v.source === 'pos');

  // Filtre produit
  if(histoFiltreProduit){
    ventesPOS = ventesPOS.filter(v => {
      const key = v.produitId || v.produitNom || 'inconnu';
      return key === histoFiltreProduit;
    });
  }

  // Compteur
  if(compteur){
    compteur.textContent = ventesPOS.length + ' vente' + (ventesPOS.length > 1 ? 's' : '');
  }

  if(ventesPOS.length === 0){
    list.innerHTML = `
      <div class="histo-empty">
        <div style="font-size:2rem;margin-bottom:8px;">📋</div>
        ${histoFiltreProduit
          ? 'Aucune vente pour ce produit.'
          : 'Aucune opération enregistrée.<br>Encaisse une première vente pour voir l\'historique.'}
      </div>
    `;
    return;
  }

  const parJour = {};
  ventesPOS.forEach(v => {
    const d = v.date || 'inconnu';
    if(!parJour[d]) parJour[d] = [];
    parJour[d].push(v);
  });

  const dates = Object.keys(parJour).sort((a,b) => b.localeCompare(a));

  list.innerHTML = dates.map(date => {
    const items = parJour[date].slice().sort((a,b) =>
      (b.createdAt||'').localeCompare(a.createdAt||'')
    );
    const ca = items.reduce((s,v) => s + (Number(v.montant)||0), 0);
    const dateLabel = date === todayISO() ? "Aujourd'hui" : BIPE.fmtDate(date);

    return `
      <div class="histo-jour">
        <div class="histo-jour-header">
          <div class="date">${dateLabel}</div>
          <div class="totaux">
            <span class="nb">${items.length} vente${items.length>1?'s':''}</span>
            <span class="ca">${BIPE.fmt(ca)} DT</span>
          </div>
        </div>
        ${items.map(v => {
          const credit = v.paye === false;
          return `
            <div class="histo-op">
              <div class="op-info">
                <div class="op-nom">${BIPE.esc(v.produitNom || 'Produit')}</div>
                <div class="op-details">
                  × ${v.quantite} · ${BIPE.fmt(v.prix)} DT/u
                  ${v.clientNom ? '· 👤 ' + BIPE.esc(v.clientNom) : ''}
                  <span class="badge-mode ${credit ? 'badge-credit' : 'badge-paye'}">
                    ${credit ? 'Crédit' : 'Payé'}
                  </span>
                </div>
              </div>
              <div class="op-montant ${credit ? 'credit' : ''}">
                ${BIPE.fmt(v.montant)} DT
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }).join('');
}

function resetFiltreHisto(){
  histoFiltreProduit = '';
  const sel = document.getElementById('histoFiltreProduit');
  if(sel) sel.value = '';
  renderHistorique();
  BIPE.toast('Filtre réinitialisé');
}

function onHistoFiltreChange(){
  const sel = document.getElementById('histoFiltreProduit');
  histoFiltreProduit = sel ? sel.value : '';
  renderHistorique();
}

/* ---------- Onglet Caisse ---------- */
function renderCaisse(){
  const container = document.getElementById('caisseContent');
  const session = getSession();
  const { entrees, sorties, net, nb } = calculerEspecesDuJour();
  const soldeFin = calculerSoldeFin();
  const cloture = !!session.soldeFin;

  const k = calculerKPIJour();

  container.innerHTML = `
    <div class="caisse-card">
      <h3>📅 Session du ${BIPE.fmtDate(session.date)}
        <span class="cloture-badge ${cloture ? 'ok' : 'ouvert'}">
          ${cloture ? '✓ Clôturée' : '● Ouverte'}
        </span>
      </h3>
      <div class="caisse-row">
        <span class="lab">Ventes du jour</span>
        <span class="val">${k.nb}</span>
      </div>
      <div class="caisse-row">
        <span class="lab">CA du jour</span>
        <span class="val plus">${BIPE.fmt(k.ca)} DT</span>
      </div>
      <div class="caisse-row">
        <span class="lab">Dont à crédit</span>
        <span class="val ${k.caCredit > 0 ? 'moins' : ''}">${BIPE.fmt(k.caCredit)} DT</span>
      </div>
    </div>

    <div class="caisse-card">
      <h3>💵 Solde de départ</h3>
      <div class="solde-big" id="soldeDepartAffichage">${BIPE.fmt(session.soldeDepart)} DT</div>
      <div class="desc">
        Montant en caisse au début de la journée. Sert à calculer le solde de fin.
      </div>
      ${!cloture ? `
        <div class="input-row">
          <input type="number" id="inputSoldeDepart" placeholder="0" step="0.01" min="0"
                 value="${session.soldeDepart || 0}">
          <button class="btn-caisse gold" onclick="validerSoldeDepart()">💾 Enregistrer</button>
        </div>
      ` : `
        <div class="desc" style="color:var(--warn);margin-top:8px;">
          🔒 Modifiable uniquement tant que la journée n'est pas clôturée.
        </div>
      `}
    </div>

    <div class="caisse-card">
      <h3>📊 Mouvements espèces du jour</h3>
      <div class="caisse-row">
        <span class="lab">Entrées espèces</span>
        <span class="val plus">+ ${BIPE.fmt(entrees)} DT</span>
      </div>
      <div class="caisse-row">
        <span class="lab">Sorties espèces</span>
        <span class="val moins">− ${BIPE.fmt(sorties)} DT</span>
      </div>
      <div class="caisse-row">
        <span class="lab">Net</span>
        <span class="val ${net >= 0 ? 'plus' : 'moins'}">${net >= 0 ? '+' : ''} ${BIPE.fmt(net)} DT</span>
      </div>
      <div class="desc" style="margin-top:8px;">
        ${nb} mouvement${nb>1?'s':''} enregistré${nb>1?'s':''} aujourd'hui.
      </div>
    </div>

    <div class="caisse-card">
      <h3>🌙 Solde de fin de journée</h3>
      <div class="solde-big fin">${BIPE.fmt(cloture ? session.soldeFin : soldeFin)} DT</div>
      <div class="desc">
        ${cloture
          ? `Clôturée le ${BIPE.fmtDate(session.clotureAt ? session.clotureAt.slice(0,10) : session.date)}.`
          : 'Calculé automatiquement : solde départ + net espèces du jour.'}
      </div>
      ${!cloture ? `
        <div class="input-row" style="margin-top:12px;">
          <button class="btn-caisse gold" style="width:100%;" onclick="cloturerJournee()">
            🔒 Clôturer la journée
          </button>
        </div>
      ` : `
        <div class="input-row" style="margin-top:12px;">
          <button class="btn-caisse danger" style="width:100%;" onclick="reouvrirJournee()">
            🔓 Réouvrir la journée
          </button>
        </div>
      `}
    </div>
  `;
}

function validerSoldeDepart(){
  const input = document.getElementById('inputSoldeDepart');
  if(!input) return;
  const val = parseFloat(input.value);
  if(isNaN(val) || val < 0){
    BIPE.toast('⚠ Montant invalide', true);
    return;
  }
  const session = getSession();
  session.soldeDepart = val;
  saveSession(session);
  BIPE.toast('✅ Solde de départ enregistré');
  renderCaisse();
}

function cloturerJournee(){
  const session = getSession();
  if(session.soldeFin){
    BIPE.toast('⚠ Journée déjà clôturée', true);
    return;
  }
  const soldeFin = calculerSoldeFin();
  if(!confirm(`Clôturer la journée ?\n\nSolde de fin : ${BIPE.fmt(soldeFin)} DT\n\nCette action n'empêche pas de nouvelles ventes — elle fige simplement le solde de fin.`)) return;

  session.soldeFin = soldeFin;
  session.clotureAt = new Date().toISOString();
  saveSession(session);
  BIPE.toast('🔒 Journée clôturée — solde de fin figé');
  renderCaisse();
}

function reouvrirJournee(){
  const session = getSession();
  if(!confirm('Réouvrir la journée ? Le solde de fin sera recalculé automatiquement.')) return;
  session.soldeFin = null;
  session.clotureAt = null;
  saveSession(session);
  BIPE.toast('🔓 Journée réouverte');
  renderCaisse();
}

/* ---------- Onglets ---------- */
function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.toggle('active', c.id === 'tab-' + tab);
  });
  if(tab === 'historique'){
    populateFiltreHistoProduits();
    renderHistorique();
  }
  if(tab === 'caisse') renderCaisse();
}

/* ---------- Produits ---------- */
function renderProduits(){
  produits = getProduitsFromStock();
  const grid = document.getElementById('produitsGrid');
  const filtered = produits.filter(p => {
    if(!searchTerm) return true;
    return p.nom.toLowerCase().includes(searchTerm.toLowerCase());
  });

  if(produits.length === 0){
    grid.innerHTML = `
      <div class="empty-produits">
        <div class="ico">📦</div>
        <h3>Aucun produit en stock</h3>
        <p>Crée d'abord un produit via <a href="f-stock.html" style="color:var(--gold-soft)">Stock</a> ou <a href="f-achats.html" style="color:var(--gold-soft)">Achats</a>.</p>
      </div>
    `;
    return;
  }
  if(filtered.length === 0){
    grid.innerHTML = `
      <div class="empty-produits" style="grid-column:1/-1;">
        <div class="ico">🔍</div>
        <h3>Aucun résultat</h3>
        <p>Aucun produit ne correspond à « ${BIPE.esc(searchTerm)} ».</p>
      </div>
    `;
    return;
  }
  grid.innerHTML = filtered.map(p => {
    const rupture = p.stock <= 0;
    const stockCls = rupture ? 'zero' : (p.stock < 5 ? 'bas' : '');
    return `
      <div class="produit-tuile ${rupture ? 'rupture' : ''}" onclick="ajouterAuPanier('${p.id}')" title="${BIPE.esc(p.nom)}">
        <div class="nom">${BIPE.esc(p.nom)}</div>
        <div class="stock ${stockCls}">${rupture ? '⚠ Rupture' : 'Stock : ' + p.stock}</div>
        <div class="prix">${p.prix > 0 ? BIPE.fmt(p.prix) + ' DT' : '—'}</div>
      </div>
    `;
  }).join('');
}

/* ---------- Panier ---------- */
function ajouterAuPanier(produitId){
  const p = produits.find(x => x.id === produitId);
  if(!p) return;
  if(p.stock <= 0){ BIPE.toast('⚠ Stock épuisé', true); return; }
  const existant = panier.find(i => i.produitId === produitId);
  if(existant){
    if(existant.qte >= p.stock){ BIPE.toast(`⚠ Stock maximum (${p.stock})`, true); return; }
    existant.qte++;
  } else {
    if(p.prix <= 0){ BIPE.toast('⚠ Ce produit n\'a pas de prix', true); return; }
    panier.push({ produitId: p.id, nom: p.nom, prix: p.prix, qte: 1, stockDispo: p.stock });
  }
  renderPanier();
}
function modifierQte(produitId, delta){
  const item = panier.find(x => x.produitId === produitId);
  if(!item) return;
  item.qte += delta;
  if(item.qte <= 0){ panier = panier.filter(x => x.produitId !== produitId); }
  else if(item.qte > item.stockDispo){
    item.qte = item.stockDispo;
    BIPE.toast(`⚠ Stock maximum : ${item.stockDispo}`, true);
  }
  renderPanier();
}
function viderPanier(){
  if(panier.length === 0) return;
  if(!confirm('Vider le panier ?')) return;
  panier = []; renderPanier();
}
function renderPanier(){
  const list = document.getElementById('panierList');
  const count = document.getElementById('panierCount');
  const badgeCount = document.getElementById('badgeCount');
  const totalArticles = document.getElementById('totalArticles');
  const totalVal = document.getElementById('totalVal');
  const btnEncaisser = document.getElementById('btnEncaisser');

  const nbArticles = panier.reduce((s,x) => s + x.qte, 0);
  const total = panier.reduce((s,x) => s + (x.qte * x.prix), 0);

  count.textContent = nbArticles;
  totalArticles.textContent = nbArticles;
  totalVal.textContent = BIPE.fmt(total);

  if(nbArticles > 0){ badgeCount.style.display = 'flex'; badgeCount.textContent = nbArticles; }
  else { badgeCount.style.display = 'none'; }

  btnEncaisser.disabled = panier.length === 0;

  if(panier.length === 0){ list.innerHTML = ''; return; }

  list.innerHTML = panier.map(item => `
    <div class="panier-item">
      <div class="info">
        <div class="nom">${BIPE.esc(item.nom)}</div>
        <div class="prix-u">${BIPE.fmt(item.prix)} DT × ${item.qte}</div>
      </div>
      <div class="qte-ctrl">
        <button onclick="modifierQte('${item.produitId}', -1)">−</button>
        <span class="qte">${item.qte}</span>
        <button onclick="modifierQte('${item.produitId}', 1)">+</button>
      </div>
      <div class="sous-total">${BIPE.fmt(item.qte * item.prix)} DT</div>
    </div>
  `).join('');
}

/* ---------- Paiement ---------- */
function setPaiement(mode){
  paiement = mode;
  document.getElementById('btnPaye').classList.toggle('active', mode === 'paye');
  document.getElementById('btnCredit').classList.toggle('active', mode === 'credit');
  document.getElementById('totalMode').textContent = mode === 'paye' ? 'Payé' : 'À crédit';
}

/* ---------- Encaisser ---------- */
function encaisser(){
  if(panier.length === 0){ BIPE.toast('⚠ Panier vide', true); return; }

  const clientSel = document.getElementById('clientSelect').value;
  let clientId = null, clientNom = null;
  if(clientSel === '__NEW__'){
    const nc = creerClientRapide();
    if(!nc) return;
    clientId = nc.id; clientNom = nc.nom;
  } else if(clientSel){
    const c = getClients().find(x => x.id === clientSel);
    if(c){ clientId = c.id; clientNom = c.nom; }
  }

  if(paiement === 'credit' && !clientId){
    BIPE.toast('⚠ Un client est requis pour une vente à crédit', true);
    return;
  }

  for(const item of panier){
    const dispo = stockDisponible(item.produitId);
    if(item.qte > dispo){
      BIPE.toast(`⚠ Stock insuffisant pour ${item.nom} (dispo : ${dispo})`, true);
      return;
    }
  }

  const date = todayISO();
  const ventes = BIPE.storage.get(BIPE.KEYS.ventes, []) || [];
  const nouvellesVentes = [];

  panier.forEach(item => {
    const montant = item.qte * item.prix;
    const vente = {
      id: 'v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6),
      produitId: item.produitId, produitNom: item.nom,
      quantite: item.qte, prix: item.prix, montant, date,
      clientId, clientNom, note: 'Vente POS', source: 'pos',
      paye: paiement === 'paye',
      montantPaye: paiement === 'paye' ? montant : 0,
      comptabilisee: false, dateCompta: null,
      createdAt: new Date().toISOString()
    };
    ventes.push(vente);
    nouvellesVentes.push(vente);
    creerMouvementSortie(vente);
    if(paiement === 'credit') ajouterCredit(vente);
  });

  BIPE.storage.set(BIPE.KEYS.ventes, ventes);

  const total = nouvellesVentes.reduce((s,v) => s + v.montant, 0);
  if(paiement === 'paye'){
    creerMouvementTresorerieEspeces(total, date, `Vente POS — ${nouvellesVentes.length} ligne(s)`);
  }

  if(document.getElementById('comptaCheck').checked){
    genererEcrituresPourVentes(nouvellesVentes);
  }

  panier = [];
  renderPanier();
  renderProduits();
  renderKPI();
  if(currentTab === 'historique'){
    populateFiltreHistoProduits();
    renderHistorique();
  }
  if(currentTab === 'caisse') renderCaisse();

  document.getElementById('comptaCheck').checked = false;
  document.getElementById('clientSelect').value = '';
  document.getElementById('newClientBox').style.display = 'none';
  clientSelectionne = null;
  setPaiement('paye');

  document.getElementById('colPanier').classList.remove('show');

  BIPE.toast(`✅ Vente encaissée — ${BIPE.fmt(total)} DT`);
}

/* ---------- Plein écran ---------- */
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}
function togglePanierMobile(){
  document.getElementById('colPanier').classList.toggle('show');
}

/* ---------- Init ---------- */
document.addEventListener('DOMContentLoaded', () => {
  populateClients();
  renderProduits();
  renderPanier();
  renderKPI();
  setPaiement('paye');

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderProduits();
  });

  // Filtre historique : le select déclenche renderHistorique directement via onchange
  const histoSel = document.getElementById('histoFiltreProduit');
  if(histoSel){
    // On remplace l'onchange inline par une fonction qui met à jour la variable
    histoSel.onchange = onHistoFiltreChange;
  }

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      document.getElementById('colPanier').classList.remove('show');
      fermerSheet();
    }
  });
});
</script>
