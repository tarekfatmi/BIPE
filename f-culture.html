<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>BIPE — Culture d'entreprise</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="shared.js"></script>
<style>
  :root{
    --black:#000000; --black-2:#0a0a0a; --black-3:#141414;
    --line:#2a2a2a; --line-soft:#1f1f1f;
    --gold:#d4af37; --gold-bright:#f0d060; --gold-soft:#e8c96a;
    --gold-dim:#8a7433; --gold-deep:#5a4a1f;
    --txt:#f5f0e1; --txt-muted:#9a9384; --txt-dim:#5a564e;
    --ok:#6b9a5a; --warn:#c9a040; --bad:#b84040; --info:#7cc4e8;
    --radius:16px; --radius-sm:12px;
    --groupe-couleur:#d98ca8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:'Baloo Bhaijaan 2', -apple-system, "Segoe UI", sans-serif;
    background:var(--black); color:var(--txt); line-height:1.6; font-weight:500;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(217,140,168,.06) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(212,175,55,.02) 0%, transparent 40%);
    background-attachment:fixed;
  }
  .app{max-width:min(1100px,92vw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:clamp(24px,4vw,40px)}

  /* ============================================================
     SHEET + OVERLAY — CSS de fallback
     ============================================================ */
  .bipe-sheet{
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
  }
  .bipe-sheet.show{
    transform:translateY(0) !important;
  }
  #bipe-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:1000;
    opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  #bipe-overlay.show{
    opacity:1 !important;
    pointer-events:auto !important;
  }

  .header{
    position:sticky;top:0;z-index:50;background:rgba(0,0,0,.92);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line-soft);
    padding:clamp(12px,2vw,16px) clamp(16px,3vw,20px);
    display:flex;align-items:center;gap:clamp(8px,1.5vw,16px);
  }
  .header .back{
    width:clamp(40px,6vw,48px);height:clamp(40px,6vw,48px);
    border-radius:14px;background:var(--black-3);border:1px solid var(--line);
    color:var(--gold-soft);font-size:clamp(1.1rem,2vw,1.4rem);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;text-decoration:none;transition:transform .15s;
  }
  .header .back:active{transform:scale(.92)}
  .header .title-block{flex:1;min-width:0}
  .header .logo{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.2rem,2.5vw,1.5rem);
    font-weight:700;color:#f0d060;line-height:1.2;letter-spacing:.02em;
  }
  .header .logo .b,.header .logo .pe{color:var(--txt)}
  .header .logo .excl{color:var(--gold);font-size:1.3em;vertical-align:middle;text-shadow:0 0 20px rgba(212,175,55,.5)}
  .header .subtitle{
    font-size:clamp(.6rem,1vw,.7rem);color:var(--txt-muted);
    font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  }
  .header .menu{
    width:clamp(40px,6vw,48px);height:clamp(40px,6vw,48px);
    border-radius:14px;background:var(--black-3);border:1px solid var(--line);
    color:var(--gold-soft);font-size:clamp(1.1rem,2vw,1.4rem);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .15s;
  }
  .header .menu:active{transform:scale(.92)}

  .content{flex:1;padding:clamp(16px,3vw,24px) clamp(16px,3vw,20px)}

  .hero-groupe{
    background:linear-gradient(135deg,var(--black-2) 0%,var(--black-3) 100%);
    border:2px solid var(--gold-deep);border-radius:var(--radius);
    padding:clamp(18px,3vw,24px);margin-bottom:clamp(16px,3vw,20px);
    position:relative;overflow:hidden;
  }
  .hero-groupe::before{
    content:'';position:absolute;top:0;left:0;width:4px;height:100%;
    background:var(--groupe-couleur);opacity:.8;
  }
  .hero-groupe .num{
    font-family:'Fredoka',sans-serif;font-size:clamp(.75rem,1vw,.85rem);
    font-weight:700;color:var(--groupe-couleur);letter-spacing:.05em;margin-bottom:6px;
  }
  .hero-groupe .ico{font-size:clamp(1.6rem,2.5vw,2rem);line-height:1;margin-bottom:6px}
  .hero-groupe h1{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.3rem,2.2vw,1.7rem);
    font-weight:700;color:var(--gold-bright);line-height:1.2;margin-bottom:4px;
  }
  .hero-groupe p{font-size:clamp(.85rem,1.1vw,1rem);color:var(--txt-muted);font-weight:500}

  .stats{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:clamp(8px,1.5vw,12px);margin-bottom:clamp(16px,3vw,20px);
  }
  .stat{
    background:var(--black-2);border:2px solid var(--line);
    border-radius:var(--radius);padding:clamp(12px,2vw,16px) clamp(10px,1.5vw,14px);
  }
  .stat .num{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.3rem,2.5vw,1.7rem);
    font-weight:700;line-height:1;margin-bottom:4px;color:var(--gold-bright);
  }
  .stat .lab{font-size:clamp(.7rem,.95vw,.8rem);color:var(--txt-muted);font-weight:600;line-height:1.3}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:clamp(14px,2.5vw,18px)}
  .btn{
    padding:clamp(11px,1.5vw,13px) clamp(16px,2vw,20px);
    border-radius:999px;border:none;cursor:pointer;
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:clamp(.88rem,1.1vw,1rem);font-weight:700;
    display:inline-flex;align-items:center;gap:8px;transition:all .2s;
  }
  .btn-gold{
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#0a0a0a;box-shadow:0 4px 16px rgba(212,175,55,.25);
  }
  .btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn-gold:active{transform:scale(.97)}
  .btn-ghost{background:var(--black-2);border:2px solid var(--line);color:var(--txt)}
  .btn-ghost:hover{border-color:var(--gold-dim)}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:clamp(14px,2.5vw,18px)}
  .filter-chip{
    padding:8px 14px;border-radius:999px;border:2px solid var(--line);
    background:var(--black-2);color:var(--txt-muted);
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:clamp(.8rem,1vw,.9rem);font-weight:600;cursor:pointer;transition:.2s;
  }
  .filter-chip.active{border-color:var(--groupe-couleur);color:var(--groupe-couleur);background:rgba(217,140,168,.08)}
  .filter-chip:hover:not(.active){color:var(--txt)}

  .list{display:flex;flex-direction:column;gap:clamp(8px,1.5vw,10px)}
  .note-card{
    background:var(--black-2);border:2px solid var(--line);
    border-radius:var(--radius);padding:clamp(14px,2.5vw,18px) clamp(16px,2.5vw,20px);
    display:flex;gap:clamp(10px,2vw,14px);align-items:flex-start;
    transition:transform .15s,border-color .15s;position:relative;overflow:hidden;
  }
  .note-card::before{
    content:'';position:absolute;top:0;left:0;width:4px;height:100%;
    background:var(--cat-couleur,var(--groupe-couleur));opacity:.9;
  }
  .note-card:hover{border-color:var(--gold-dim)}
  .note-card.valeur::before{background:#b8a0f0}
  .note-card.rituel::before{background:#d98ca8}
  .note-card.manifeste::before{background:#e8c96a}
  .note-card.note::before{background:var(--txt-muted)}
  .note-body{flex:1;min-width:0}
  .note-head{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;margin-bottom:6px;flex-wrap:wrap;
  }
  .note-titre{
    font-family:'Fredoka',sans-serif;font-size:clamp(.95rem,1.4vw,1.1rem);
    font-weight:700;color:var(--txt);line-height:1.3;flex:1;min-width:0;
  }
  .note-cat{
    padding:2px 8px;border-radius:6px;font-size:clamp(.65rem,.85vw,.72rem);
    font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
  }
  .cat-valeur{background:rgba(167,139,250,.15);color:#b8a0f0}
  .cat-rituel{background:rgba(217,140,168,.15);color:#d98ca8}
  .cat-manifeste{background:rgba(232,201,106,.15);color:var(--gold-soft)}
  .cat-note{background:rgba(255,255,255,.06);color:var(--txt-muted)}
  .note-content{
    font-size:clamp(.82rem,1.05vw,.92rem);color:var(--txt-muted);
    font-weight:500;line-height:1.6;margin-bottom:6px;white-space:pre-wrap;
  }
  .note-date{
    font-size:clamp(.7rem,.9vw,.78rem);color:var(--txt-dim);font-weight:600;
  }
  .note-actions{display:flex;gap:4px;flex-shrink:0}
  .icon-btn{
    width:clamp(32px,4.5vw,36px);height:clamp(32px,4.5vw,36px);
    border-radius:10px;background:var(--black-3);border:1px solid var(--line);
    color:var(--txt-muted);font-size:clamp(.85rem,1.2vw,.95rem);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;
  }
  .icon-btn:hover{border-color:var(--gold-dim);color:var(--gold-soft)}
  .icon-btn.danger:hover{border-color:var(--bad);color:#e08a8a}

  .empty{
    text-align:center;padding:clamp(40px,8vw,60px) clamp(20px,3vw,24px);
    background:var(--black-2);border:2px dashed var(--line);border-radius:var(--radius);
  }
  .empty .ico{font-size:clamp(2.5rem,6vw,3.5rem);margin-bottom:12px;opacity:.6}
  .empty h3{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.1rem,1.8vw,1.3rem);
    color:var(--gold-soft);margin-bottom:8px;
  }
  .empty p{font-size:clamp(.85rem,1.1vw,1rem);color:var(--txt-muted);margin-bottom:16px}

  .footer{
    text-align:center;padding:clamp(20px,3vw,28px) 16px 16px;
    font-size:clamp(.72rem,.9vw,.8rem);color:var(--txt-dim);
    line-height:1.8;font-weight:500;border-top:1px solid var(--line-soft);margin-top:auto;
  }
  .footer .brand{color:var(--gold-soft);font-weight:700}

  .form-group{margin-bottom:clamp(14px,2vw,18px)}
  label{
    display:block;font-size:clamp(.85rem,1vw,.95rem);
    color:var(--txt-muted);margin-bottom:6px;font-weight:600;
  }
  label .required{color:var(--bad);margin-left:2px}
  input,textarea,select{
    width:100%;padding:clamp(12px,1.5vw,14px) clamp(14px,2vw,16px);
    border-radius:var(--radius-sm);border:2px solid var(--line);
    background:var(--black-3);color:var(--txt);
    font-size:clamp(.95rem,1.1vw,1rem);
    font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:500;transition:all .2s;
  }
  input:focus,textarea:focus,select:focus{
    outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.12);
  }
  input::placeholder,textarea::placeholder{color:var(--txt-dim)}
  textarea{resize:vertical;min-height:120px}
  select{cursor:pointer}

  @media (max-width:600px){
    .stats{grid-template-columns:1fr}
    .note-actions{flex-direction:column}
  }
</style>
</head>
<body data-groupe="g5">

<div class="app">

  <div class="header">
    <a href="groupe-rh-culture.html" class="back">←</a>
    <div class="title-block">
      <div class="logo"><span class="b">B</span><span class="excl">!</span><span class="pe">PE</span></div>
      <div class="subtitle">RH · Culture</div>
    </div>
    <button class="menu" onclick="BIPE.openMenu()">⋮</button>
  </div>

  <div class="content">

    <div class="hero-groupe">
      <div class="num">GROUPE 05</div>
      <div class="ico">✨</div>
      <h1>Culture d'entreprise</h1>
      <p>Valeurs, rituels, manifeste. Ce qui fait ton identité.</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="statValeurs">0</div><div class="lab">Valeurs</div></div>
      <div class="stat"><div class="num" id="statRituels">0</div><div class="lab">Rituels</div></div>
      <div class="stat"><div class="num" id="statManifeste">0</div><div class="lab">Manifeste</div></div>
      <div class="stat"><div class="num" id="statNotes">0</div><div class="lab">Notes</div></div>
    </div>

    <div class="toolbar">
      <button class="btn btn-gold" onclick="openForm()"><span>＋</span> Nouvelle entrée</button>
      <button class="btn btn-ghost" onclick="exportCulture()"><span>📤</span> Exporter</button>
    </div>

    <div class="filters" id="filters">
      <button class="filter-chip active" data-filter="tous" onclick="setFilter('tous')">Tous</button>
      <button class="filter-chip" data-filter="valeur" onclick="setFilter('valeur')">Valeurs</button>
      <button class="filter-chip" data-filter="rituel" onclick="setFilter('rituel')">Rituels</button>
      <button class="filter-chip" data-filter="manifeste" onclick="setFilter('manifeste')">Manifeste</button>
      <button class="filter-chip" data-filter="note" onclick="setFilter('note')">Notes</button>
    </div>

    <div class="list" id="list"></div>

  </div>

  <div class="footer">
    <span class="brand">BIPE</span> · Bureau Intelligent Pour Entrepreneur<br>
    RH & Culture · Culture · Version 1.0
  </div>

</div>

<!-- OVERLAY (présent dès le chargement) -->
<div id="bipe-overlay" onclick="BIPE.closeAllSheets()"></div>

<!-- SHEET FORMULAIRE -->
<div id="sheet-form" class="bipe-sheet" style="
  position:fixed;left:0;right:0;bottom:0;background:#0a0a0a;
  border-radius:24px 24px 0 0;border-top:2px solid #5a4a1f;
  z-index:1001;max-height:92vh;display:flex;flex-direction:column;
  max-width:720px;margin:0 auto;
">
  <div style="width:48px;height:5px;background:#2a2a2a;border-radius:3px;margin:12px auto 8px;flex-shrink:0;"></div>
  <div style="padding:8px 24px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f1f1f;">
    <h3 id="formTitle" style="font-family:'Fredoka',sans-serif;font-size:1.5rem;color:#e8c96a;font-weight:700;">Nouvelle entrée</h3>
    <button onclick="BIPE.closeAllSheets()" style="
      width:44px;height:44px;border-radius:12px;background:#141414;
      border:1px solid #2a2a2a;color:#f5f0e1;font-size:1.4rem;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
    ">✕</button>
  </div>
  <div style="padding:20px 24px 24px;overflow-y:auto;flex:1;">
    <div class="form-group">
      <label>Catégorie <span class="required">*</span></label>
      <select id="fCat">
        <option value="valeur">Valeur</option>
        <option value="rituel">Rituel</option>
        <option value="manifeste">Manifeste</option>
        <option value="note">Note</option>
      </select>
    </div>
    <div class="form-group">
      <label>Titre <span class="required">*</span></label>
      <input type="text" id="fTitre" placeholder="Ex : Le respect avant tout" maxlength="120">
    </div>
    <div class="form-group">
      <label>Contenu <span class="required">*</span></label>
      <textarea id="fContenu" placeholder="Décris cette valeur, ce rituel, cette note..." maxlength="2000"></textarea>
    </div>
    <button class="btn btn-gold" style="width:100%;justify-content:center;margin-top:8px;" onclick="saveEntry()">💾 Enregistrer</button>
  </div>
</div>

<script>
/* ============================================================
   BIPE — f-culture.html (CORRIGÉ)
   Groupe 5 — RH & Culture : culture d'entreprise
   ============================================================ */

BIPE.checkSession();

let entries = [];
let filter = 'tous';
let editingId = null;

/* ---------- Sheet sécurisée ---------- */
function ouvrirSheet(id){
  let overlay = document.getElementById('bipe-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'bipe-overlay';
    overlay.onclick = BIPE.closeAllSheets;
    document.body.appendChild(overlay);
  }
  overlay.classList.add('show');
  const sheet = document.getElementById(id);
  if(sheet) sheet.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function fermerSheet(){
  const overlay = document.getElementById('bipe-overlay');
  if(overlay) overlay.classList.remove('show');
  document.querySelectorAll('.bipe-sheet').forEach(s => s.classList.remove('show'));
  document.body.style.overflow = '';
}

/* ---------- Chargement ---------- */
function load(){
  entries = BIPE.storage.get(BIPE.KEYS.culture, []) || [];
  render();
}

function save(){
  BIPE.storage.set(BIPE.KEYS.culture, entries);
}

/* ---------- Rendu ---------- */
function render(){
  renderStats();
  renderList();
}

function renderStats(){
  document.getElementById('statValeurs').textContent = entries.filter(e => e.categorie === 'valeur').length;
  document.getElementById('statRituels').textContent = entries.filter(e => e.categorie === 'rituel').length;
  document.getElementById('statManifeste').textContent = entries.filter(e => e.categorie === 'manifeste').length;
  document.getElementById('statNotes').textContent = entries.filter(e => e.categorie === 'note').length;
}

function matchFilter(e){
  if(filter === 'tous') return true;
  return e.categorie === filter;
}

function renderList(){
  const list = document.getElementById('list');
  let items = entries.filter(matchFilter);
  items.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));

  if(items.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="ico">✨</div>
        <h3>Aucune entrée</h3>
        <p>${filter === 'tous' ? 'Commence par définir une valeur ou un rituel.' : 'Aucune entrée dans cette catégorie.'}</p>
        <button class="btn btn-gold" style="margin:0 auto;" onclick="openForm()">＋ Nouvelle entrée</button>
      </div>
    `;
    return;
  }

  const labels = {valeur:'Valeur', rituel:'Rituel', manifeste:'Manifeste', note:'Note'};
  list.innerHTML = items.map(e => {
    const cat = e.categorie || 'note';
    return `
      <div class="note-card ${cat}">
        <div class="note-body">
          <div class="note-head">
            <div class="note-titre">${BIPE.esc(e.titre)}</div>
            <span class="note-cat cat-${cat}">${labels[cat]}</span>
          </div>
          <div class="note-content">${BIPE.esc(e.contenu)}</div>
          <div class="note-date">📅 ${e.createdAt ? BIPE.fmtDate(e.createdAt) : '—'}</div>
        </div>
        <div class="note-actions">
          <button class="icon-btn" onclick="openForm('${e.id}')" title="Modifier">✏️</button>
          <button class="icon-btn danger" onclick="deleteEntry('${e.id}')" title="Supprimer">🗑</button>
        </div>
      </div>
    `;
  }).join('');
}

/* ---------- Filtres ---------- */
function setFilter(f){
  filter = f;
  document.querySelectorAll('.filter-chip').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderList();
}

/* ---------- Formulaire ---------- */
function openForm(id){
  editingId = id || null;
  const title = document.getElementById('formTitle');
  if(id){
    const e = entries.find(x => x.id === id);
    if(!e) return;
    title.textContent = 'Modifier l\'entrée';
    document.getElementById('fCat').value = e.categorie || 'note';
    document.getElementById('fTitre').value = e.titre || '';
    document.getElementById('fContenu').value = e.contenu || '';
  } else {
    title.textContent = 'Nouvelle entrée';
    document.getElementById('fCat').value = 'valeur';
    document.getElementById('fTitre').value = '';
    document.getElementById('fContenu').value = '';
  }
  ouvrirSheet('sheet-form');
  setTimeout(() => {
    try { document.getElementById('fTitre').focus(); } catch(e){}
  }, 300);
}

function saveEntry(){
  const categorie = document.getElementById('fCat').value;
  const titre = document.getElementById('fTitre').value.trim();
  const contenu = document.getElementById('fContenu').value.trim();

  if(!titre || !contenu){
    BIPE.toast('⚠ Titre et contenu obligatoires', true);
    return;
  }

  if(editingId){
    const e = entries.find(x => x.id === editingId);
    if(e){
      e.categorie = categorie;
      e.titre = titre;
      e.contenu = contenu;
      e.updatedAt = new Date().toISOString();
    }
    BIPE.toast('✅ Entrée modifiée');
  } else {
    entries.push({
      id: Date.now().toString(36),
      categorie, titre, contenu,
      createdAt: new Date().toISOString()
    });
    BIPE.toast('✅ Entrée ajoutée');
  }

  save();
  fermerSheet();
  render();
}

function deleteEntry(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  if(!confirm(`Supprimer "${e.titre}" ?`)) return;
  entries = entries.filter(x => x.id !== id);
  save();
  render();
  BIPE.toast('🗑 Entrée supprimée');
}

function exportCulture(){
  BIPE.exportJSON('culture', entries);
}
