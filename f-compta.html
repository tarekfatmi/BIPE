<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>BIPE — Écritures comptables</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="shared.js"></script>
<style>
  :root{
    --black:#000000; --black-2:#0a0a0a; --black-3:#141414;
    --line:#2a2a2a; --line-soft:#1f1f1f;
    --gold:#d4af37; --gold-bright:#f0d060; --gold-soft:#e8c96a;
    --gold-dim:#8a7433; --gold-deep:#5a4a1f;
    --txt:#f5f0e1; --txt-muted:#9a9384; --txt-dim:#5a564e;
    --ok:#6b9a5a; --warn:#c9a040; --bad:#b84040; --info:#7cc4e8;
    --radius:16px; --radius-sm:12px;
    --groupe-couleur:#c9a040;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:'Baloo Bhaijaan 2', -apple-system, "Segoe UI", sans-serif;
    background:var(--black); color:var(--txt); line-height:1.6; font-weight:500;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(201,160,64,.06) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(212,175,55,.02) 0%, transparent 40%);
    background-attachment:fixed;
  }
  .app{max-width:min(1100px,92vw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:clamp(24px,4vw,40px)}

  /* ============================================================
     SHEET + OVERLAY — CSS ajouté pour corriger le bug
     ============================================================ */
  .bipe-sheet{
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
  }
  .bipe-sheet.show{
    transform:translateY(0) !important;
  }
  #bipe-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:1000;
    opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  #bipe-overlay.show{
    opacity:1 !important;
    pointer-events:auto !important;
  }

  .header{
    position:sticky;top:0;z-index:50;background:rgba(0,0,0,.92);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line-soft);
    padding:clamp(12px,2vw,16px) clamp(16px,3vw,20px);
    display:flex;align-items:center;gap:clamp(8px,1.5vw,16px);
  }
  .header .back{
    width:clamp(40px,6vw,48px);height:clamp(40px,6vw,48px);
    border-radius:14px;background:var(--black-3);border:1px solid var(--line);
    color:var(--gold-soft);font-size:clamp(1.1rem,2vw,1.4rem);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;text-decoration:none;transition:transform .15s;
  }
  .header .back:active{transform:scale(.92)}
  .header .title-block{flex:1;min-width:0}
  .header .logo{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.2rem,2.5vw,1.5rem);
    font-weight:700;color:#f0d060;line-height:1.2;letter-spacing:.02em;
  }
  .header .logo .b,.header .logo .pe{color:var(--txt)}
  .header .logo .excl{color:var(--gold);font-size:1.3em;vertical-align:middle;text-shadow:0 0 20px rgba(212,175,55,.5)}
  .header .subtitle{
    font-size:clamp(.6rem,1vw,.7rem);color:var(--txt-muted);
    font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  }
  .header .menu{
    width:clamp(40px,6vw,48px);height:clamp(40px,6vw,48px);
    border-radius:14px;background:var(--black-3);border:1px solid var(--line);
    color:var(--gold-soft);font-size:clamp(1.1rem,2vw,1.4rem);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .15s;
  }
  .header .menu:active{transform:scale(.92)}

  .content{flex:1;padding:clamp(16px,3vw,24px) clamp(16px,3vw,20px)}

  .hero-groupe{
    background:linear-gradient(135deg,var(--black-2) 0%,var(--black-3) 100%);
    border:2px solid var(--gold-deep);border-radius:var(--radius);
    padding:clamp(18px,3vw,24px);margin-bottom:clamp(16px,3vw,20px);
    position:relative;overflow:hidden;
  }
  .hero-groupe::before{
    content:'';position:absolute;top:0;left:0;width:4px;height:100%;
    background:var(--groupe-couleur);opacity:.8;
  }
  .hero-groupe .num{
    font-family:'Fredoka',sans-serif;font-size:clamp(.75rem,1vw,.85rem);
    font-weight:700;color:var(--groupe-couleur);letter-spacing:.05em;margin-bottom:6px;
  }
  .hero-groupe .ico{font-size:clamp(1.6rem,2.5vw,2rem);line-height:1;margin-bottom:6px}
  .hero-groupe h1{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.3rem,2.2vw,1.7rem);
    font-weight:700;color:var(--gold-bright);line-height:1.2;margin-bottom:4px;
  }
  .hero-groupe p{font-size:clamp(.85rem,1.1vw,1rem);color:var(--txt-muted);font-weight:500}

  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:clamp(8px,1.5vw,12px);margin-bottom:clamp(16px,3vw,20px);
  }
  .stat{
    background:var(--black-2);border:2px solid var(--line);
    border-radius:var(--radius);padding:clamp(12px,2vw,16px) clamp(10px,1.5vw,14px);
  }
  .stat .num{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.3rem,2.5vw,1.7rem);
    font-weight:700;line-height:1;margin-bottom:4px;
  }
  .stat .lab{font-size:clamp(.7rem,.95vw,.8rem);color:var(--txt-muted);font-weight:600;line-height:1.3}
  .stat.debit .num{color:var(--info)}
  .stat.credit .num{color:var(--ok)}
  .stat.solde .num{color:var(--gold-bright)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:clamp(14px,2.5vw,18px)}
  .btn{
    padding:clamp(11px,1.5vw,13px) clamp(16px,2vw,20px);
    border-radius:999px;border:none;cursor:pointer;
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:clamp(.88rem,1.1vw,1rem);font-weight:700;
    display:inline-flex;align-items:center;gap:8px;transition:all .2s;
  }
  .btn-gold{
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#0a0a0a;box-shadow:0 4px 16px rgba(212,175,55,.25);
  }
  .btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn-gold:active{transform:scale(.97)}
  .btn-ghost{background:var(--black-2);border:2px solid var(--line);color:var(--txt)}
  .btn-ghost:hover{border-color:var(--gold-dim)}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:clamp(14px,2.5vw,18px)}
  .filter-chip{
    padding:8px 14px;border-radius:999px;border:2px solid var(--line);
    background:var(--black-2);color:var(--txt-muted);
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-size:clamp(.8rem,1vw,.9rem);font-weight:600;cursor:pointer;transition:.2s;
  }
  .filter-chip.active{border-color:var(--groupe-couleur);color:var(--groupe-couleur);background:rgba(201,160,64,.08)}
  .filter-chip:hover:not(.active){color:var(--txt)}

  .list{display:flex;flex-direction:column;gap:clamp(8px,1.5vw,10px)}
  .ecriture-card{
    background:var(--black-2);border:2px solid var(--line);
    border-radius:var(--radius);padding:clamp(14px,2.5vw,18px) clamp(16px,2.5vw,20px);
    display:flex;gap:clamp(10px,2vw,14px);align-items:flex-start;
    transition:transform .15s,border-color .15s;position:relative;overflow:hidden;
  }
  .ecriture-card::before{
    content:'';position:absolute;top:0;left:0;width:4px;height:100%;
    background:var(--groupe-couleur);opacity:.7;
  }
  .ecriture-card:hover{border-color:var(--gold-dim)}
  .ecriture-body{flex:1;min-width:0}
  .ecriture-head{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;margin-bottom:6px;flex-wrap:wrap;
  }
  .ecriture-libelle{
    font-family:'Fredoka',sans-serif;font-size:clamp(.95rem,1.4vw,1.1rem);
    font-weight:700;color:var(--txt);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
  }
  .ecriture-date{
    font-size:clamp(.72rem,.95vw,.82rem);color:var(--txt-dim);
    font-weight:600;white-space:nowrap;
  }
  .ecriture-meta{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    font-size:clamp(.78rem,1vw,.88rem);font-weight:600;
  }
  .ecriture-meta .compte{
    color:var(--txt-muted);padding:2px 8px;border-radius:6px;
    background:rgba(255,255,255,.04);
  }
  .ecriture-meta .montant{font-weight:700}
  .ecriture-meta .debit{color:var(--info)}
  .ecriture-meta .credit{color:var(--ok)}
  .ecriture-actions{display:flex;gap:4px;flex-shrink:0}
  .icon-btn{
    width:clamp(32px,4.5vw,36px);height:clamp(32px,4.5vw,36px);
    border-radius:10px;background:var(--black-3);border:1px solid var(--line);
    color:var(--txt-muted);font-size:clamp(.85rem,1.2vw,.95rem);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;
  }
  .icon-btn:hover{border-color:var(--gold-dim);color:var(--gold-soft)}
  .icon-btn.danger:hover{border-color:var(--bad);color:#e08a8a}

  .empty{
    text-align:center;padding:clamp(40px,8vw,60px) clamp(20px,3vw,24px);
    background:var(--black-2);border:2px dashed var(--line);border-radius:var(--radius);
  }
  .empty .ico{font-size:clamp(2.5rem,6vw,3.5rem);margin-bottom:12px;opacity:.6}
  .empty h3{
    font-family:'Fredoka',sans-serif;font-size:clamp(1.1rem,1.8vw,1.3rem);
    color:var(--gold-soft);margin-bottom:8px;
  }
  .empty p{font-size:clamp(.85rem,1.1vw,1rem);color:var(--txt-muted);margin-bottom:16px}

  .footer{
    text-align:center;padding:clamp(20px,3vw,28px) 16px 16px;
    font-size:clamp(.72rem,.9vw,.8rem);color:var(--txt-dim);
    line-height:1.8;font-weight:500;border-top:1px solid var(--line-soft);margin-top:auto;
  }
  .footer .brand{color:var(--gold-soft);font-weight:700}

  .form-group{margin-bottom:clamp(14px,2vw,18px)}
  label{
    display:block;font-size:clamp(.85rem,1vw,.95rem);
    color:var(--txt-muted);margin-bottom:6px;font-weight:600;
  }
  label .required{color:var(--bad);margin-left:2px}
  input,textarea,select{
    width:100%;padding:clamp(12px,1.5vw,14px) clamp(14px,2vw,16px);
    border-radius:var(--radius-sm);border:2px solid var(--line);
    background:var(--black-3);color:var(--txt);
    font-size:clamp(.95rem,1.1vw,1rem);
    font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:500;transition:all .2s;
  }
  input:focus,textarea:focus,select:focus{
    outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.12);
  }
  input::placeholder,textarea::placeholder{color:var(--txt-dim)}
  textarea{resize:vertical;min-height:80px}
  select{cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  @media (max-width:600px){
    .stats{grid-template-columns:1fr}
    .row{grid-template-columns:1fr}
    .ecriture-actions{flex-direction:column}
  }
</style>
</head>
<body data-groupe="g4">

<div class="app">

  <div class="header">
    <a href="groupe-comptabilite.html" class="back">←</a>
    <div class="title-block">
      <div class="logo"><span class="b">B</span><span class="excl">!</span><span class="pe">PE</span></div>
      <div class="subtitle">Comptabilité · Écritures</div>
    </div>
    <button class="menu" onclick="BIPE.openMenu()">⋮</button>
  </div>

  <div class="content">

    <div class="hero-groupe">
      <div class="num">GROUPE 04</div>
      <div class="ico">📝</div>
      <h1>Écritures comptables</h1>
      <p>Journal des débits et crédits. Chaque ligne compte.</p>
    </div>

    <div class="stats">
      <div class="stat debit"><div class="num" id="statDebit">0</div><div class="lab">Total<br>débits</div></div>
      <div class="stat credit"><div class="num" id="statCredit">0</div><div class="lab">Total<br>crédits</div></div>
      <div class="stat solde"><div class="num" id="statSolde">0</div><div class="lab">Solde<br>(débit − crédit)</div></div>
    </div>

    <div class="toolbar">
      <button class="btn btn-gold" onclick="openForm()"><span>＋</span> Nouvelle écriture</button>
      <button class="btn btn-ghost" onclick="exportCompta()"><span>📤</span> Exporter</button>
    </div>

    <div class="filters" id="filters">
      <button class="filter-chip active" data-filter="tous" onclick="setFilter('tous')">Toutes</button>
      <button class="filter-chip" data-filter="debit" onclick="setFilter('debit')">Débits</button>
      <button class="filter-chip" data-filter="credit" onclick="setFilter('credit')">Crédits</button>
      <button class="filter-chip" data-filter="mois" onclick="setFilter('mois')">Ce mois</button>
    </div>

    <div class="list" id="list"></div>

  </div>

  <div class="footer">
    <span class="brand">BIPE</span> · Bureau Intelligent Pour Entrepreneur<br>
    Comptabilité · Écritures · Version 1.0
  </div>

</div>

<!-- OVERLAY (présent dès le chargement) -->
<div id="bipe-overlay" onclick="BIPE.closeAllSheets()"></div>

<!-- SHEET FORM -->
<div id="sheet-form" class="bipe-sheet" style="
  position:fixed;left:0;right:0;bottom:0;background:#0a0a0a;
  border-radius:24px 24px 0 0;border-top:2px solid #5a4a1f;
  z-index:1001;max-height:92vh;display:flex;flex-direction:column;
  max-width:720px;margin:0 auto;
">
  <div style="width:48px;height:5px;background:#2a2a2a;border-radius:3px;margin:12px auto 8px;flex-shrink:0;"></div>
  <div style="padding:8px 24px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f1f1f;">
    <h3 id="formTitle" style="font-family:'Fredoka',sans-serif;font-size:1.5rem;color:#e8c96a;font-weight:700;">Nouvelle écriture</h3>
    <button onclick="BIPE.closeAllSheets()" style="
      width:44px;height:44px;border-radius:12px;background:#141414;
      border:1px solid #2a2a2a;color:#f5f0e1;font-size:1.4rem;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
    ">✕</button>
  </div>
  <div style="padding:20px 24px 24px;overflow-y:auto;flex:1;">
    <div class="form-group">
      <label>Libellé <span class="required">*</span></label>
      <input type="text" id="fLibelle" placeholder="Ex : Achat fournitures" maxlength="120">
    </div>
    <div class="form-group">
      <label>Date <span class="required">*</span></label>
      <input type="date" id="fDate">
    </div>
    <div class="row">
      <div class="form-group">
        <label>Compte <span class="required">*</span></label>
        <input type="text" id="fCompte" placeholder="Ex : 512 Banque" maxlength="40">
      </div>
      <div class="form-group">
        <label>Sens <span class="required">*</span></label>
        <select id="fSens">
          <option value="debit">Débit</option>
          <option value="credit">Crédit</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Montant (DT) <span class="required">*</span></label>
      <input type="number" id="fMontant" placeholder="0" step="0.01" min="0">
    </div>
    <div class="form-group">
      <label>Note</label>
      <textarea id="fNote" placeholder="Détails..." maxlength="300"></textarea>
    </div>
    <button class="btn btn-gold" style="width:100%;justify-content:center;margin-top:8px;" onclick="saveEcriture()">💾 Enregistrer</button>
  </div>
</div>

<script>
/* ============================================================
   BIPE — f-compta.html (CORRIGÉ)
   Groupe 4 — Comptabilité : écritures
   ============================================================ */

BIPE.checkSession();

let ecritures = [];
let filter = 'tous';
let editingId = null;

function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------- Sheet sécurisée ---------- */
function ouvrirSheet(id){
  let overlay = document.getElementById('bipe-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'bipe-overlay';
    overlay.onclick = BIPE.closeAllSheets;
    document.body.appendChild(overlay);
  }
  overlay.classList.add('show');
  const sheet = document.getElementById(id);
  if(sheet) sheet.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function fermerSheet(){
  const overlay = document.getElementById('bipe-overlay');
  if(overlay) overlay.classList.remove('show');
  document.querySelectorAll('.bipe-sheet').forEach(s => s.classList.remove('show'));
  document.body.style.overflow = '';
}

function load(){
  ecritures = BIPE.storage.get(BIPE.KEYS.compta, []) || [];
  render();
}

function save(){
  BIPE.storage.set(BIPE.KEYS.compta, ecritures);
}

function render(){
  renderStats();
  renderList();
}

function renderStats(){
  const debits = ecritures.filter(e => e.sens === 'debit').reduce((s,e) => s + (Number(e.montant)||0), 0);
  const credits = ecritures.filter(e => e.sens === 'credit').reduce((s,e) => s + (Number(e.montant)||0), 0);
  document.getElementById('statDebit').textContent = BIPE.fmt(debits);
  document.getElementById('statCredit').textContent = BIPE.fmt(credits);
  document.getElementById('statSolde').textContent = BIPE.fmt(debits - credits);
}

function matchFilter(e){
  if(filter === 'tous') return true;
  if(filter === 'debit') return e.sens === 'debit';
  if(filter === 'credit') return e.sens === 'credit';
  if(filter === 'mois'){
    if(!e.date) return false;
    const now = new Date();
    const d = new Date(e.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }
  return true;
}

function renderList(){
  const list = document.getElementById('list');
  let items = ecritures.filter(matchFilter);
  items.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  if(items.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="ico">📝</div>
        <h3>Aucune écriture</h3>
        <p>${filter === 'tous' ? 'Enregistre ta première écriture comptable.' : 'Aucune écriture dans ce filtre.'}</p>
        <button class="btn btn-gold" style="margin:0 auto;" onclick="openForm()">＋ Nouvelle écriture</button>
      </div>
    `;
    return;
  }

  list.innerHTML = items.map(e => {
    const sens = e.sens === 'debit' ? 'Débit' : 'Crédit';
    const cls = e.sens === 'debit' ? 'debit' : 'credit';
    return `
      <div class="ecriture-card">
        <div class="ecriture-body">
          <div class="ecriture-head">
            <div class="ecriture-libelle">${BIPE.esc(e.libelle)}</div>
            <div class="ecriture-date">${e.date ? BIPE.fmtDate(e.date) : '—'}</div>
          </div>
          <div class="ecriture-meta">
            <span class="compte">${BIPE.esc(e.compte||'—')}</span>
            <span class="montant ${cls}">${sens} · ${BIPE.fmt(e.montant)} DT</span>
          </div>
          ${e.note ? `<div style="margin-top:6px;font-size:.82rem;color:var(--txt-dim);">${BIPE.esc(e.note)}</div>` : ''}
        </div>
        <div class="ecriture-actions">
          <button class="icon-btn" onclick="openForm('${e.id}')" title="Modifier">✏️</button>
          <button class="icon-btn danger" onclick="deleteEcriture('${e.id}')" title="Supprimer">🗑</button>
        </div>
      </div>
    `;
  }).join('');
}

function setFilter(f){
  filter = f;
  document.querySelectorAll('.filter-chip').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderList();
}

function openForm(id){
  editingId = id || null;
  const title = document.getElementById('formTitle');
  if(id){
    const e = ecritures.find(x => x.id === id);
    if(!e) return;
    title.textContent = 'Modifier l\'écriture';
    document.getElementById('fLibelle').value = e.libelle || '';
    document.getElementById('fDate').value = e.date || todayISO();
    document.getElementById('fCompte').value = e.compte || '';
    document.getElementById('fSens').value = e.sens || 'debit';
    document.getElementById('fMontant').value = e.montant || '';
    document.getElementById('fNote').value = e.note || '';
  } else {
    title.textContent = 'Nouvelle écriture';
    document.getElementById('fLibelle').value = '';
    document.getElementById('fDate').value = todayISO();
    document.getElementById('fCompte').value = '';
    document.getElementById('fSens').value = 'debit';
    document.getElementById('fMontant').value = '';
    document.getElementById('fNote').value = '';
  }
  ouvrirSheet('sheet-form');
  setTimeout(() => { try { document.getElementById('fLibelle').focus(); } catch(e){} }, 300);
}

function saveEcriture(){
  const libelle = document.getElementById('fLibelle').value.trim();
  const date = document.getElementById('fDate').value;
  const compte = document.getElementById('fCompte').value.trim();
  const sens = document.getElementById('fSens').value;
  const montant = parseFloat(document.getElementById('fMontant').value);
  const note = document.getElementById('fNote').value.trim();

  if(!libelle || !date || !compte || !montant || montant <= 0){
    BIPE.toast('⚠ Remplis libellé, date, compte et montant', true);
    return;
  }

  if(editingId){
    const e = ecritures.find(x => x.id === editingId);
    if(e){
      e.libelle = libelle; e.date = date; e.compte = compte;
      e.sens = sens; e.montant = montant; e.note = note;
      e.updatedAt = new Date().toISOString();
    }
    BIPE.toast('✅ Écriture modifiée');
  } else {
    ecritures.push({
      id: Date.now().toString(36),
      libelle, date, compte, sens, montant, note,
      createdAt: new Date().toISOString()
    });
    BIPE.toast('✅ Écriture enregistrée');
  }

  save();
  fermerSheet();
  render();
}

function deleteEcriture(id){
  const e = ecritures.find(x => x.id === id);
  if(!e) return;
  if(!confirm(`Supprimer "${e.libelle}" ?`)) return;
  ecritures = ecritures.filter(x => x.id !== id);
  save();
  render();
  BIPE.toast('🗑 Écriture supprimée');
}

function exportCompta(){
  BIPE.exportJSON('compta', ecritures);
}

document.addEventListener('DOMContentLoaded', () => {
  load();
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') fermerSheet();
  });
});
</script>
